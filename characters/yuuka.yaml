id: yuuka
display_name: 早瀨優香
birthday: "03-14"  # MM-DD, 圓周率日

style_anchor: >
  Hayase Yuuka from Blue Archive, 16 years old, purple long hair in twin tails,
  purple eyes, black geometric halo ring, Millennium Science School uniform,
  holding a scientific calculator, anime illustration, consistent character design,
  clean lineart, soft lighting

affection_milestones:
  20: 語氣稍軟，會多關心一點老師的飲食與作息
  50: 偶爾露出關心卻用預算審核包裝；可觸發 special CG
  80: 明顯口嫌體正直，回憶共同經歷更自然；優先 special CG
  100: 重大好感階段，限定 CG（Pro/Max）

# 後端規則加分／扣分（與 DeepSeek 建議合併後再 clamp）
scoring:
  # 每日基礎：有實質聊天（非空 ping）
  chat:
    base: 1
    daily_cap: 8          # 同一伺服器每天聊天加分上限（不含特殊事件）
    meaningful_min_chars: 2

  # 工作／會計相關互動加分（關鍵詞或 LLM tag=work）
  work:
    delta: 3
    daily_cap: 12
    keywords:
      - 報帳
      - 核銷
      - 預算
      - 會計
      - 記帳
      - 審核
      - 報表
      - 文件
      - 整理收據
      - 算盤
      - 計算機
      - 珠算
      - 對帳
      - 財務
      - 成本
      - 開會
      - 工作

  # 優香不喜歡 → 扣分（關鍵詞或 LLM tag=dislike）
  dislike:
    delta: -5
    daily_floor: -20      # 每天最多扣多少（絕對值上限）
    keywords:
      - 亂花錢
      - 課金
      - 不報帳
      - 泡麵
      - 收據亂丟
      - 堆積文件
      - 遲到
      - 邋遢
      - 奢侈
      - 亂買
      - 手遊課金
      - 不核銷

  # 日曆事件：當天主動提及／祝賀／相關行動才加（需 LLM 或關鍵詞命中）
  calendar:
    birthday:
      date: "03-14"
      delta: 15
      once_per_year: true
      keywords: ["生日", "生日快樂", "圓周率", "3/14", "3月14"]
    festivals:
      - id: new_year
        dates: ["01-01"]
        delta: 8
        once_per_year: true
        keywords: ["新年快樂", "元旦", "過年", "除夕"]
      - id: valentine
        dates: ["02-14"]
        delta: 8
        once_per_year: true
        keywords: ["情人節", "巧克力"]
      - id: white_day
        dates: ["03-14"]
        delta: 5
        once_per_year: true
        keywords: ["白色情人節"]
      - id: halloween
        dates: ["10-31"]
        delta: 6
        once_per_year: true
        keywords: ["萬聖節", "萬聖"]
      - id: christmas
        dates: ["12-24", "12-25"]
        delta: 8
        once_per_year: true
        keywords: ["聖誕", "Christmas"]
      - id: midnight_party_memory
        dates: ["12-31"]
        delta: 10
        once_per_year: true
        keywords: ["除夕", "睡衣派對", "鬼抓人", "午夜派對"]

  # DeepSeek 回傳的 affection_change 權重（與規則合併）
  llm_weight: 1.0
  rule_weight: 1.0
  final_clamp: [-15, 20]  # 單次回合最終加減分上下限（生日可另加）
